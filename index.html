<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <meta name="description" content="LIMINAL 是一个安静的情绪陪伴空间，收录对话、月相、答案、信件与记忆。">
  <title>LIMINAL · 情绪陪伴空间</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2314171c'/%3E%3Cpath d='M39 14c-9 3-14 12-11 21s12 14 21 11c-4 7-13 11-21 8C16 50 10 37 14 25s15-18 25-11Z' fill='%23b8c8ff'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f5f7;
      --panel: rgba(255,255,255,.82);
      --panel-solid: #fbfbfc;
      --ink: #15171c;
      --muted: #737782;
      --line: rgba(21,23,28,.11);
      --shadow: 0 18px 52px rgba(31,37,50,.10), 0 2px 10px rgba(31,37,50,.06);
      --accent: #6f82ff;
      --accent-2: #c2ccff;
      --glow: rgba(111,130,255,.24);
      --radius: 26px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% 4%, rgba(191,205,255,.65), transparent 30rem),
        radial-gradient(circle at 3% 78%, rgba(219,224,255,.72), transparent 28rem),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    .app {
      width: min(100%, 1180px);
      min-height: 100vh;
      margin: 0 auto;
      padding: max(30px, env(safe-area-inset-top)) clamp(20px, 5vw, 64px) calc(112px + env(safe-area-inset-bottom));
      position: relative;
    }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    .wordmark { margin: 0 0 20px; font-size: .72rem; letter-spacing: .34em; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 4.4rem); line-height: .98; letter-spacing: -.055em; max-width: 720px; }
    h1 span { color: var(--muted); font-weight: 500; }
    .status-stack { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
    .date-pill { border: 1px solid var(--line); background: rgba(255,255,255,.54); border-radius: 999px; padding: 10px 15px; font-size: .82rem; color: var(--muted); backdrop-filter: blur(16px); }
    .profile-pill { border:1px solid var(--line); background:rgba(255,255,255,.72); border-radius:999px; padding:5px 11px 5px 5px; display:flex; align-items:center; gap:8px; cursor:pointer; backdrop-filter:blur(16px); font-weight:750; }
    .profile-avatar { width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--line);font-size:1rem; }
    .mood-strip {
      margin: clamp(28px, 5vw, 48px) 0 26px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255,255,255,.52);
      display: flex; align-items: center; gap: 14px;
      backdrop-filter: blur(18px);
    }
    .pulse { width: 10px; height: 10px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 0 7px var(--glow); }
    .mood-copy { flex: 1; min-width: 0; }
    .mood-copy strong { display: block; font-size: .92rem; }
    .mood-copy span { color: var(--muted); font-size: .82rem; }
    .mood-button { border: 0; border-bottom: 1px solid var(--ink); background: none; padding: 5px 0; cursor: pointer; font-weight: 700; font-size: .82rem; }
    .grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
    .tile {
      min-height: 172px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: 0 4px 16px rgba(42,47,60,.04);
      display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between;
      text-align: left; cursor: pointer; position: relative; overflow: hidden;
      transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
      backdrop-filter: blur(16px);
    }
    .tile::after { content: ""; position: absolute; width: 100px; height: 100px; border-radius: 50%; background: var(--glow); right: -70px; top: -70px; filter: blur(4px); transition: transform .3s ease; }
    .tile:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: rgba(111,130,255,.28); }
    .tile:hover::after { transform: translate(-26px,26px) scale(1.25); }
    .tile:focus-visible, .nav-button:focus-visible, .primary:focus-visible, .ghost:focus-visible, .icon-button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    .icon { width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); box-shadow: 0 7px 18px rgba(31,37,50,.07); }
    .icon svg { width: 23px; height: 23px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tile-kicker { margin-top: 24px; color: var(--muted); font-size: .68rem; letter-spacing: .18em; font-weight: 800; }
    .tile h2 { font-size: 1.12rem; margin: 6px 0 0; letter-spacing: -.02em; }
    .tile p { margin: 5px 0 0; font-size: .79rem; line-height: 1.45; color: var(--muted); }
    .tile.feature { grid-column: span 2; color: #f8f9ff; background: #171a22; border-color: #171a22; }
    .tile.feature .icon { background: rgba(255,255,255,.11); color: #fff; border-color: rgba(255,255,255,.14); box-shadow: none; }
    .tile.feature .tile-kicker, .tile.feature p { color: #b9bdc9; }
    .tile.feature::before { content:""; position:absolute; inset:auto -20% -70% 25%; height:180px; background:radial-gradient(circle,rgba(111,130,255,.55),transparent 64%); }
    .nav {
      position: fixed; z-index: 20; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      width: min(calc(100% - 32px), 540px); padding: 7px;
      background: rgba(249,250,252,.82); border: 1px solid rgba(21,23,28,.12); border-radius: 22px;
      display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; box-shadow: 0 18px 46px rgba(31,37,50,.16); backdrop-filter: blur(24px);
    }
    .nav-button { border: 0; background: transparent; border-radius: 16px; padding: 10px 6px; color: var(--muted); cursor: pointer; display: grid; gap: 3px; place-items: center; font-size: .67rem; }
    .nav-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .nav-button.active { color: var(--ink); background: #fff; box-shadow: 0 3px 12px rgba(31,37,50,.07); font-weight: 700; }
    .view { display: none; }
    .view.active { display: block; animation: rise .36s ease both; }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:20px; margin: 8px 0 28px; }
    .section-head h2 { font-size: clamp(2rem,5vw,3.6rem); margin:0; letter-spacing:-.05em; }
    .section-head p { margin:8px 0 0; color:var(--muted); }
    .empty { border:1px dashed rgba(21,23,28,.22); border-radius:26px; padding:52px 24px; text-align:center; color:var(--muted); background:rgba(255,255,255,.3); }
    .memory-list { display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap:14px; }
    .memory { min-height:150px; padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:22px; display:flex; flex-direction:column; justify-content:space-between; }
    .memory p { font-size:1rem; line-height:1.6; margin:0; white-space:pre-wrap; }
    .memory time { color:var(--muted); font-size:.75rem; margin-top:20px; }
    .settings { display:grid; gap:12px; }
    .setting { display:flex; justify-content:space-between; align-items:center; gap:18px; padding:20px; border:1px solid var(--line); border-radius:22px; background:var(--panel); }
    .setting strong { display:block; }.setting span { font-size:.82rem;color:var(--muted); }
    .swatches { display:flex; gap:9px; }.swatch { width:30px;height:30px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px var(--line);cursor:pointer; }.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink);}
    .overlay { position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center; padding:20px; background:rgba(12,14,18,.28); backdrop-filter:blur(8px); }
    .overlay.open { display:flex; animation:fade .22s ease; }
    .dialog { width:min(100%,680px); max-height:min(86vh,780px); overflow:auto; background:var(--panel-solid); border:1px solid rgba(255,255,255,.7); border-radius:30px; box-shadow:0 26px 80px rgba(20,25,37,.24); padding:24px; animation:sheet .32s cubic-bezier(.2,.8,.2,1); }
    @keyframes fade { from { opacity:0; } } @keyframes sheet { from { transform:translateY(28px); opacity:.5; } }
    .dialog-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; }
    .dialog-head small { display:block;color:var(--muted);font-weight:700;letter-spacing:.16em;margin-bottom:4px; }.dialog-head h2{margin:0;font-size:1.55rem;letter-spacing:-.03em;}
    .icon-button { width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.3rem; }
    .dialog-copy { color:var(--muted);line-height:1.7;margin:0 0 20px; }
    .field { width:100%;border:1px solid var(--line);border-radius:17px;background:#fff;padding:14px 16px;color:var(--ink);outline:none;resize:vertical; }
    .field:focus { border-color:var(--accent);box-shadow:0 0 0 4px var(--glow); }
    textarea.field { min-height:120px; }
    .actions { display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap; }
    .primary,.ghost { border-radius:14px;padding:12px 17px;font-weight:750;cursor:pointer;border:1px solid transparent; }
    .primary { background:var(--ink);color:white; }.primary:hover{background:#292d36}.ghost{background:#fff;border-color:var(--line)}
    .answer-card { margin-top:18px; min-height:180px; padding:26px; border-radius:22px; display:grid; place-items:center; text-align:center; color:white; background:linear-gradient(145deg,#171a22,#2a3150); position:relative; overflow:hidden; }
    .answer-card::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--accent);filter:blur(80px);opacity:.28;right:-70px;bottom:-110px}.answer-card p{font-size:clamp(1.35rem,4vw,2rem);line-height:1.35;margin:0;position:relative;z-index:1;}
    .moon-wrap { display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center;padding:10px; }
    .moon { width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#fff,#dde3ff 45%,#8fa1ff 100%);box-shadow:0 0 70px var(--glow),inset -22px -12px 35px rgba(61,72,130,.22); }
    .moon-data strong { display:block;font-size:2rem;letter-spacing:-.04em; }.moon-data span{color:var(--muted);line-height:1.6;}
    .dialog.chat-dialog { width:min(100%,980px);height:min(86vh,760px);display:flex;flex-direction:column;overflow:hidden; }
    .chat-dialog .dialog-head { margin-bottom:14px; }
    .chat-dialog #modalBody { min-height:0;flex:1; }
    .chat-hub { height:100%;display:flex;flex-direction:column;min-height:0; }
    .chat-account { display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:18px;background:#fff; }
    .chat-account-main { display:flex;align-items:center;gap:10px;min-width:0; }.chat-account-main .profile-avatar{width:38px;height:38px}.chat-account-main strong{display:block}.chat-account-main span{display:block;color:var(--muted);font-size:.75rem}
    .chat-layout { display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;min-height:0;flex:1; }
    .chat-sidebar { min-height:0;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.55);padding:10px;display:flex;flex-direction:column; }
    .chat-tabs { display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#eceef3;border-radius:13px; }
    .chat-tab { border:0;border-radius:10px;padding:8px;background:transparent;color:var(--muted);cursor:pointer;font-weight:750;font-size:.82rem; }.chat-tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(31,37,50,.07)}
    .new-chat { margin:9px 0;border:1px dashed rgba(21,23,28,.22);border-radius:12px;background:transparent;padding:9px;cursor:pointer;font-size:.78rem;font-weight:750; }
    .chat-list { overflow:auto;display:grid;gap:5px;align-content:start; }
    .chat-list-item { width:100%;border:0;border-radius:14px;background:transparent;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer; }.chat-list-item:hover,.chat-list-item.active{background:#fff}.chat-list-item .avatar{width:38px;height:38px;border-radius:13px;background:#eef0f6;display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}.chat-list-item strong{display:block;font-size:.87rem}.chat-list-item small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
    .chat-room { min-width:0;min-height:0;border:1px solid var(--line);border-radius:20px;background:#fff;display:flex;flex-direction:column;overflow:hidden; }
    .chat-room-head { min-height:59px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px; }.chat-room-head .avatar{width:38px;height:38px;border-radius:13px;background:#eef0f6;display:grid;place-items:center}.chat-room-head strong{display:block}.chat-room-head span{display:block;color:var(--muted);font-size:.75rem}
    .chat-log { flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px; }
    .message-row { display:flex;align-items:flex-end;gap:7px;max-width:88%; }.message-row.user{align-self:flex-end;flex-direction:row-reverse}.message-avatar{width:28px;height:28px;border-radius:9px;background:#eef0f6;display:grid;place-items:center;font-size:.82rem;flex:0 0 auto}.message-body small{display:block;color:var(--muted);font-size:.68rem;margin:0 0 3px 4px}.message-row.user .message-body small{text-align:right;margin:0 4px 3px 0}
    .bubble { padding:10px 13px;border-radius:16px;line-height:1.5;font-size:.88rem;white-space:pre-wrap;background:#f1f2f5;border-bottom-left-radius:5px; }.message-row.user .bubble{background:var(--ink);color:white;border-bottom-left-radius:16px;border-bottom-right-radius:5px}
    .chat-form { display:flex;gap:8px;border-top:1px solid var(--line);padding:10px; }.chat-form .field{min-width:0;padding:11px 13px}.chat-form .primary{flex:0 0 auto;padding:10px 14px}
    .chat-setup { padding:20px;overflow:auto; }.chat-setup h3{margin:0 0 6px}.chat-setup p{color:var(--muted);font-size:.82rem;margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .wide{grid-column:1/-1}.avatar-choices{display:flex;gap:8px;flex-wrap:wrap}.avatar-choice{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:1.1rem}.avatar-choice.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}.member-choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.member-choice{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff}.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:30px}
    .future-list { margin-top:18px;display:grid;gap:10px; }.future-note{padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:#fff}.future-note p{margin:0 0 8px;line-height:1.55}.future-note time{font-size:.75rem;color:var(--muted)}
    .fortune { padding:28px;text-align:center;border-radius:24px;background:linear-gradient(155deg,#fff,#edf0ff);border:1px solid var(--line); }.fortune-mark{font-size:3rem}.fortune h3{font-size:1.7rem;margin:8px 0}.fortune p{color:var(--muted);line-height:1.7}.fortune-meter{height:8px;background:#dfe4f6;border-radius:99px;overflow:hidden;margin:20px 0 8px}.fortune-meter span{display:block;height:100%;background:var(--accent);border-radius:inherit}.fortune small{color:var(--muted)}
    .notice { align-items:center; }.notice .dialog { max-width:560px;text-align:left; }.notice-mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--ink);color:#fff;margin-bottom:22px}.notice h2{font-size:2rem;letter-spacing:-.04em;margin:0 0 14px}.notice p{line-height:1.8;color:var(--muted)}.notice .primary{width:100%;margin-top:8px}
    .toast { position:fixed;z-index:80;left:50%;bottom:112px;transform:translate(-50%,18px);background:#15171c;color:#fff;border-radius:999px;padding:11px 16px;font-size:.82rem;opacity:0;pointer-events:none;transition:.25s ease;box-shadow:var(--shadow);}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.memory-list{grid-template-columns:repeat(2,minmax(0,1fr))}.date-pill{display:none}}
    @media (max-width:680px){.date-pill{display:none}.profile-pill span:last-child{display:none}.dialog.chat-dialog{height:92vh;padding:14px}.chat-layout{grid-template-columns:104px minmax(0,1fr);gap:8px}.chat-sidebar{padding:7px}.chat-tabs{grid-template-columns:1fr}.chat-tab{padding:7px 3px}.new-chat{font-size:0}.new-chat::after{content:'+ 新建';font-size:.72rem}.chat-list-item{display:grid;justify-items:center;padding:8px 4px}.chat-list-item small{display:none}.chat-list-item strong{font-size:.7rem;text-align:center;max-width:82px;overflow:hidden;text-overflow:ellipsis}.chat-list-item .avatar{width:36px;height:36px}.chat-account{padding:8px}.chat-account-main span{display:none}}
    @media (max-width:520px){.app{padding:26px 16px 108px}.wordmark{margin-bottom:14px}h1{font-size:2.35rem}.mood-strip{margin-top:26px}.grid{gap:11px}.tile{min-height:152px;padding:16px;border-radius:22px}.tile.feature{grid-column:span 2}.tile p{display:none}.memory-list{grid-template-columns:1fr}.overlay{padding:6px}.dialog{border-radius:24px;padding:18px}.moon-wrap{grid-template-columns:1fr;text-align:center;justify-items:center}.nav{width:calc(100% - 20px);bottom:max(10px,env(safe-area-inset-bottom))}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.member-choices{grid-template-columns:1fr}}

  </style>
</head>
<body>
  <main class="app">
    <section class="view active" id="homeView" aria-label="主页">
      <header class="topbar">
        <div>
          <p class="wordmark">LIMINAL</p>
          <h1><span id="greeting">晚上好，</span><br>给心一点空白。</h1>
        </div>
        <div class="status-stack">
          <button class="profile-pill" data-open="profile" aria-label="编辑个人主页"><span class="profile-avatar" id="homeAvatar">🌙</span><span id="homeName">Möbius</span></button>
          <div class="date-pill" id="today"></div>
        </div>
      </header>

      <div class="mood-strip">
        <span class="pulse" aria-hidden="true"></span>
        <div class="mood-copy"><strong id="moodTitle">此刻状态：平静</strong><span id="moodHint">今天也可以慢一点。</span></div>
        <button class="mood-button" data-open="mood">记录心情</button>
      </div>

      <div class="grid">
        <button class="tile feature" data-open="chat">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4Z"/><path d="M8 9h8M8 13h5"/></svg></span>
          <span><span class="tile-kicker">COMPANION</span><h2>和 Echo 聊一会</h2><p>一个安静的倾听者，陪你整理此刻的念头。</p></span>
        </button>
        <button class="tile" data-open="moon">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.8 15.1A9 9 0 1 1 8.9 3.2 7 7 0 0 0 20.8 15.1Z"/></svg></span>
          <span><span class="tile-kicker">MOON</span><h2>今晚月色</h2><p>看看月相，也看看自己的节奏。</p></span>
        </button>
        <button class="tile" data-open="oracle">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22Z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5A2.5 2.5 0 0 1 20 22Z"/><path d="m17 7 .5 1.5L19 9l-1.5.5L17 11l-.5-1.5L15 9l1.5-.5Z"/></svg></span>
          <span><span class="tile-kicker">ORACLE</span><h2>答案之页</h2><p>写下问题，得到一份温柔的随机提示。</p></span>
        </button>
        <button class="tile" data-open="memory">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4Z"/><path d="m3 4 2 4h14l2-4ZM9 12h6"/></svg></span>
          <span><span class="tile-kicker">ARCHIVE</span><h2>记忆盒</h2><p><span id="memoryCount">0</span> 份被好好收起的记忆。</p></span>
        </button>
        <button class="tile" data-open="letter">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 6h18v13H3Z"/><path d="m3 7 9 7 9-7"/></svg></span>
          <span><span class="tile-kicker">LETTER</span><h2>写给未来</h2><p>给未来某一天的自己留一句话。</p></span>

    <section class="view" id="memoriesView" aria-label="记忆">

        <div class="setting"><div><strong>关于 LIMINAL</strong><span>这是一个反思与情绪记录空间，不提供医疗或决策建议。</span></div><button class="ghost" data-open="about">查看说明</button></div>

    <button class="nav-button" data-view="memoriesView"><svg viewBox="0 0 24 24"><path d="M4 8h16v12H4ZM3 4h18v4H3Z"/></svg><span>记忆</span></button>
    <button class="nav-button" data-view="momentsView"><svg viewBox="0 0 24 24"><path d="M12 21s8-4.6 8-11a4.5 4.5 0 0 0-8-2.5A4.5 4.5 0 0 0 4 10c0 6.4 8 11 8 11Z"/></svg><span>片刻</span></button>

  <div class="overlay notice" id="notice" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
    <div class="dialog"><div class="notice-mark">✦</div><p class="wordmark">A QUIET NOTE</p><h2 id="noticeTitle">欢迎来到 LIMINAL</h2><p>这里的随机答案、运势与对话只为带来片刻灵感，不适合替你做医疗、财务或人生重大决定。愿你把它当作一页安静的纸，而真正的选择始终属于你。</p><button class="primary" id="acceptNotice">我知道了，进入空间</button></div>
  </div>

  <div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="dialog"><div class="dialog-head"><div><small id="modalKicker">LIMINAL</small><h2 id="modalTitle">标题</h2></div><button class="icon-button" id="closeModal" aria-label="关闭">×</button></div><div id="modalBody"></div></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const state = {
      memories: JSON.parse(localStorage.getItem('liminal.memories') || '[]'),
      notes: JSON.parse(localStorage.getItem('liminal.notes') || '[]'),
      moods: JSON.parse(localStorage.getItem('liminal.moods') || '[]'),
      profile: JSON.parse(localStorage.getItem('liminal.profile') || '{"name":"Eddy@01567","avatar":"🌙"}'),
      characters: JSON.parse(localStorage.getItem('liminal.characters') || '[{"id":"echo","name":"Echo","avatar":"🌙","persona":"温柔、耐心，善于倾听"},{"id":"rin","name":"Rin","avatar":"🌿","persona":"清醒、直接，但很关心你"},{"id":"sol","name":"Sol","avatar":"☀️","persona":"明亮、乐观，擅长发现小确幸"}]'),
      groups: JSON.parse(localStorage.getItem('liminal.groups') || '[{"id":"living-room","name":"深夜客厅","avatar":"🛋️","members":["echo","rin","sol"]}]'),
      threads: JSON.parse(localStorage.getItem('liminal.threads') || '{}'),
      accent: localStorage.getItem('liminal.accent') || '#6f82ff'
    };
    const legacyChats = JSON.parse(localStorage.getItem('liminal.chats') || '[]');
    if(legacyChats.length && !state.threads['dm:echo']) state.threads['dm:echo']=legacyChats.map(x=>({sender:x.role==='user'?'user':'echo',text:x.text,time:Date.now()}));
    const chatUI = { mode:'private', activeId:'echo' };
    const $ = (s, root=document) => root.querySelector(s);
    const $$ = (s, root=document) => [...root.querySelectorAll(s)];
    const safe = value => String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const stamp = () => new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date());
    const persist = key => localStorage.setItem(`liminal.${key}`, JSON.stringify(state[key]));
    const toast = text => { const el=$('#toast'); el.textContent=text; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),1800); };

    function setAccent(color){ state.accent=color; localStorage.setItem('liminal.accent',color); document.documentElement.style.setProperty('--accent',color); document.documentElement.style.setProperty('--glow',color+'3d'); $$('.swatch').forEach(s=>s.setAttribute('aria-pressed',String(s.dataset.accent===color))); }
    setAccent(state.accent);

    const now = new Date();
    $('#today').textContent = new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}).format(now);
    function renderProfile(){
      const part=now.getHours()<6?'夜深了':now.getHours()<12?'早上好':now.getHours()<18?'下午好':'晚上好';
      $('#greeting').textContent=`${part}，${state.profile.name}`; $('#homeAvatar').textContent=state.profile.avatar; $('#homeName').textContent=state.profile.name;
    }
    renderProfile();

    function openModal(type){
      const content = modalContent(type); if(!content) return;
      $('#modalKicker').textContent=content.kicker; $('#modalTitle').textContent=content.title; $('#modalBody').innerHTML=content.body;
      $('#modal .dialog').classList.toggle('chat-dialog',type==='chat');
      $('#modal').classList.add('open'); document.body.style.overflow='hidden'; bindModal(type); if(type!=='chat')setTimeout(()=>$('#modal .field')?.focus(),50);
    }
    function closeModal(){ $('#modal').classList.remove('open'); document.body.style.overflow=''; }
    $('#closeModal').onclick=closeModal;
    $('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

    function modalContent(type){
      if(type==='chat') return {kicker:'MESSAGES',title:'自定义聊天',body:`<div class="chat-hub" id="chatHub"></div>`};
      if(type==='moon') { const phase=moonPhase(); return {kicker:'MOON',title:'今晚月色',body:`<div class="moon-wrap"><div class="moon" aria-hidden="true"></div><div class="moon-data"><strong>${phase.name}</strong><span>月龄约 ${phase.age} 天<br>${phase.copy}</span></div></div>`}; }
      if(type==='oracle') return {kicker:'ORACLE',title:'答案之页',body:`<p class="dialog-copy">先在心里停留几秒，写下一个没有标准答案的问题。</p><textarea class="field" id="question" maxlength="180" placeholder="例如：我现在最需要关注什么？"></textarea><div class="actions"><button class="primary" id="revealAnswer">翻开这一页</button></div><div class="answer-card" id="answerCard"><p>答案还藏在下一页。</p></div>`};
      if(type==='memory') return {kicker:'ARCHIVE',title:'收起一份记忆',body:`<p class="dialog-copy">记住一件微小但真实的事。它只会保存在你的设备里。</p><textarea class="field" id="memoryText" maxlength="360" placeholder="今天有什么值得留下？"></textarea><div class="actions"><button class="primary" id="saveMemory">放进记忆盒</button></div>`};
      if(type==='letter') return {kicker:'LETTER',title:'写给未来的自己',body:`<textarea class="field" id="letterText" maxlength="360" placeholder="未来的我，希望你记得……"></textarea><div class="actions"><button class="primary" id="saveLetter">封好这封信</button></div><div class="future-list">${renderNotes()}</div>`};
      if(type==='fortune') { const f=todayFortune(); return {kicker:'TODAY',title:'今日微光',body:`<div class="fortune"><div class="fortune-mark">${f.mark}</div><h3>${f.title}</h3><p>${f.copy}</p><div class="fortune-meter"><span style="width:${f.score}%"></span></div><small>今日能量 ${f.score}% · 仅作轻松参考</small></div>`}; }
      if(type==='breath') return {kicker:'PAUSE',title:'呼吸一分钟',body:`<p class="dialog-copy">吸气四拍，停留四拍，再缓缓呼气六拍。</p><div class="answer-card"><p id="breathText">准备好时，按下开始。</p></div><div class="actions"><button class="primary" id="startBreath">开始 60 秒</button></div>`};
      if(type==='mood') return {kicker:'NOW',title:'此刻感觉如何？',body:`<p class="dialog-copy">不必解释，先选一个最接近的词。</p><div class="actions" style="justify-content:flex-start">${['平静','轻盈','疲惫','混乱','期待'].map(x=>`<button class="ghost mood-choice" data-mood="${x}">${x}</button>`).join('')}</div>`};
      if(type==='profile') return {kicker:'MY SPACE',title:'编辑我的主页',body:`<p class="dialog-copy">昵称和头像会显示在主页，也会用于你的所有聊天。</p><div class="form-grid"><label class="wide">昵称<input class="field" id="profileName" maxlength="16" value="${safe(state.profile.name)}"></label><div class="wide"><span style="display:block;margin-bottom:8px">头像</span><div class="avatar-choices" id="profileAvatars">${['🌙','⭐','🫧','🐈','🪐','🌿','🦋','☁️'].map(a=>`<button class="avatar-choice ${a===state.profile.avatar?'selected':''}" data-avatar="${a}" type="button">${a}</button>`).join('')}</div></div></div><div class="actions"><button class="primary" id="saveProfile">保存主页</button></div>`};
      if(type==='about') return {kicker:'ABOUT',title:'关于这个空间',body:`<p class="dialog-copy">LIMINAL 是一个原创的轻量情绪陪伴网页。记忆、信件、心情与聊天记录都保存在当前浏览器中，不会被发送到服务器。随机答案与运势只用于自我反思和娱乐。</p>`};
    }

    function bindModal(type){
      if(type==='chat'){
        renderChatHub();
      }
      if(type==='oracle') $('#revealAnswer').onclick=()=>{ const q=$('#question').value.trim(); if(!q){toast('先写下一个问题');return;} $('#answerCard p').textContent=oracleAnswer(q); };
      if(type==='memory') $('#saveMemory').onclick=()=>{ const text=$('#memoryText').value.trim(); if(!text){toast('先写下一段记忆');return;} saveMemory(text); closeModal(); toast('记忆已经收好'); };
      if(type==='letter') $('#saveLetter').onclick=()=>{ const text=$('#letterText').value.trim(); if(!text){toast('先写下一句话');return;} state.notes.unshift({text,time:Date.now()}); persist('notes'); closeModal(); renderMoments(); toast('这封信已经封好'); };
      if(type==='breath') $('#startBreath').onclick=startBreath;
      if(type==='mood') $$('.mood-choice').forEach(b=>b.onclick=()=>{ const mood=b.dataset.mood; state.moods.unshift({mood,time:Date.now()}); persist('moods'); $('#moodTitle').textContent=`此刻状态：${mood}`; $('#moodHint').textContent=moodCopy[mood]; closeModal(); renderMoments(); toast('心情已记录'); });
      if(type==='profile'){
        let avatar=state.profile.avatar; $$('#profileAvatars .avatar-choice').forEach(b=>b.onclick=()=>{avatar=b.dataset.avatar;$$('#profileAvatars .avatar-choice').forEach(x=>x.classList.toggle('selected',x===b));});
        $('#saveProfile').onclick=()=>{const name=$('#profileName').value.trim();if(!name){toast('请填写昵称');return;}state.profile={name,avatar};persist('profile');renderProfile();closeModal();toast('主页已经更新');};
      }
    }

    const moodCopy={平静:'今天也可以慢一点。',轻盈:'把这份轻松多留一会。',疲惫:'先照顾自己，再处理世界。',混乱:'不必立刻把所有事理清。',期待:'给好事情留一点位置。'};
    function saveMemory(text){ state.memories.unshift({text,time:Date.now()}); persist('memories'); renderMemories(); }
    function renderMemories(){ $('#memoryCount').textContent=state.memories.length; $('#memoryList').innerHTML=state.memories.length?state.memories.map(m=>`<article class="memory"><p>${safe(m.text)}</p><time>${new Date(m.time).toLocaleString('zh-CN')}</time></article>`).join(''):`<div class="empty" style="grid-column:1/-1">这里还是空的。等一件值得记住的小事发生。</div>`; }
    function renderNotes(){ return state.notes.length?state.notes.slice(0,3).map(n=>`<article class="future-note"><p>${safe(n.text)}</p><time>${new Date(n.time).toLocaleString('zh-CN')}</time></article>`).join(''):`<div class="empty">还没有寄出的信。</div>`; }
    function renderMoments(){ const items=[...state.moods.map(x=>({text:`那一刻，我感到${x.mood}。`,time:x.time})),...state.notes].sort((a,b)=>b.time-a.time); $('#momentList').innerHTML=items.length?items.map(x=>`<article class="memory"><p>${safe(x.text)}</p><time>${new Date(x.time).toLocaleString('zh-CN')}</time></article>`).join(''):`<div class="empty" style="grid-column:1/-1">记录一种心情，或给未来写一封信。</div>`; }
    function threadKey(mode=chatUI.mode,id=chatUI.activeId){ return `${mode==='private'?'dm':'group'}:${id}`; }
    function getChatItems(){ return chatUI.mode==='private'?state.characters:state.groups; }
    function getCharacter(id){ return state.characters.find(x=>x.id===id); }
    function getGroup(id){ return state.groups.find(x=>x.id===id); }
    function lastMessage(id){ const list=state.threads[threadKey(chatUI.mode,id)]||[]; return list.at(-1)?.text || (chatUI.mode==='private'?'还没有消息':'开始一场多人对话'); }
    function renderChatHub(){
      const hub=$('#chatHub'); if(!hub)return;
      const items=getChatItems(); if(!items.some(x=>x.id===chatUI.activeId))chatUI.activeId=items[0]?.id||null;
      hub.innerHTML=`<div class="chat-account"><div class="chat-account-main"><span class="profile-avatar">${state.profile.avatar}</span><div><strong>${safe(state.profile.name)}</strong><span>我的主页 · 昵称和头像可随时修改</span></div></div><button class="ghost" id="editChatProfile">编辑主页</button></div><div class="chat-layout"><aside class="chat-sidebar"><div class="chat-tabs"><button class="chat-tab ${chatUI.mode==='private'?'active':''}" data-chat-mode="private">私聊</button><button class="chat-tab ${chatUI.mode==='group'?'active':''}" data-chat-mode="group">群聊</button></div><button class="new-chat" id="newChat">${chatUI.mode==='private'?'+ 创建角色':'+ 创建群聊'}</button><div class="chat-list" id="chatList"></div></aside><section class="chat-room" id="chatRoom"></section></div>`;
      $('#editChatProfile').onclick=()=>openModal('profile');
      $$('[data-chat-mode]',hub).forEach(b=>b.onclick=()=>{chatUI.mode=b.dataset.chatMode;chatUI.activeId=(chatUI.mode==='private'?state.characters:state.groups)[0]?.id||null;renderChatHub();});
      $('#newChat').onclick=()=>showChatSetup(chatUI.mode);
      renderChatList(); renderChatRoom();
    }
    function renderChatList(){
      const list=$('#chatList'); if(!list)return; const items=getChatItems();
      list.innerHTML=items.length?items.map(x=>`<button class="chat-list-item ${x.id===chatUI.activeId?'active':''}" data-chat-id="${x.id}"><span class="avatar">${x.avatar}</span><span style="min-width:0"><strong>${safe(x.name)}</strong><small>${safe(lastMessage(x.id))}</small></span></button>`).join(''):`<div class="chat-empty">还没有会话</div>`;
      $$('[data-chat-id]',list).forEach(b=>b.onclick=()=>{chatUI.activeId=b.dataset.chatId;renderChatList();renderChatRoom();});
    }
    function renderChatRoom(){
      const room=$('#chatRoom'); if(!room)return; const item=chatUI.mode==='private'?getCharacter(chatUI.activeId):getGroup(chatUI.activeId);
      if(!item){room.innerHTML='<div class="chat-empty">创建一个会话后，就可以开始聊天。</div>';return;}
      const members=chatUI.mode==='private'?[item]:(item.members||[]).map(getCharacter).filter(Boolean);
      const subtitle=chatUI.mode==='private'?item.persona:`${members.map(x=>x.name).join('、')} · ${members.length} 位成员`;
      const messages=state.threads[threadKey()]||[];
      const start=chatUI.mode==='private'?`${item.name} 在这里。和 TA 说点什么吧。`:`欢迎来到「${item.name}」，每位成员都会加入对话。`;
      room.innerHTML=`<header class="chat-room-head"><span class="avatar">${item.avatar}</span><div><strong>${safe(item.name)}</strong><span>${safe(subtitle)}</span></div></header><div class="chat-log" id="chatLog">${messages.length?messages.map(renderMessage).join(''):`<div class="chat-empty">${safe(start)}</div>`}</div><form class="chat-form" id="chatForm"><input class="field" id="chatInput" maxlength="240" placeholder="发消息给${chatUI.mode==='group'?'大家':safe(item.name)}……" aria-label="聊天内容"><button class="primary">发送</button></form>`;
      $('#chatForm').onsubmit=e=>{e.preventDefault();const input=$('#chatInput');const text=input.value.trim();if(!text)return;sendChatMessage(text,chatUI.mode,chatUI.activeId);input.value='';};
      const log=$('#chatLog');log.scrollTop=log.scrollHeight;
    }
    function renderMessage(message){
      const sender=message.sender==='user'?state.profile:getCharacter(message.sender)||{name:'未知成员',avatar:'·'}; const mine=message.sender==='user';
      return `<div class="message-row ${mine?'user':''}"><span class="message-avatar">${sender.avatar}</span><div class="message-body"><small>${safe(sender.name)}</small><div class="bubble">${safe(message.text)}</div></div></div>`;
    }
    function replyFor(character,text,offset=0){
      const gentle=['我听见了。你愿意再说一点吗？','如果不急着解决，你最希望被理解的是什么？','这件事对你很重要，我会认真听。','先别责怪自己，我们可以慢慢理清。'];
      const direct=['我想直接问一句：你真正想要的结果是什么？','先抓住最重要的一件事，其他的可以稍后再处理。','你的感受成立，但也别忘了给事实留一个位置。','如果今天只能做一步，就选最小的那一步。'];
      const bright=['我从这句话里看见了一点希望。','也许今天可以先奖励自己一个小小的完成。','别忘了，你已经比昨天多走了一点。','听起来需要一点光——去做一件能让身体放松的小事吧。'];
      const pool=character.persona.includes('直接')?direct:character.persona.includes('明亮')?bright:gentle;return pool[(Math.abs(hash(text+character.id))+offset)%pool.length];
    }
    function sendChatMessage(text,mode=chatUI.mode,id=chatUI.activeId){
      const key=threadKey(mode,id); const thread=state.threads[key]||(state.threads[key]=[]); thread.push({sender:'user',text,time:Date.now()});
      if(mode==='private'){
        const character=getCharacter(id);if(!character)throw new Error('找不到这个角色');thread.push({sender:character.id,text:replyFor(character,text),time:Date.now()});
      }else{
        const group=getGroup(id);if(!group)throw new Error('找不到这个群聊');const members=(group.members||[]).map(getCharacter).filter(Boolean);if(!members.length)throw new Error('群聊中还没有成员');
        const first=Math.abs(hash(text))%members.length;const responders=[members[first],members[(first+1)%members.length]].filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);responders.forEach((character,i)=>thread.push({sender:character.id,text:replyFor(character,text,i),time:Date.now()+i}));
      }
      persist('threads');if($('#chatHub')){renderChatList();renderChatRoom();}return {sent:true,replies:thread.slice(thread.findLastIndex(x=>x.sender==='user')+1).length};
    }
    function showChatSetup(mode){
      const room=$('#chatRoom');if(!room)return;const avatars=['🌙','🌿','☀️','🪐','🐈','🦋','☁️','🫧'];
      if(mode==='private')room.innerHTML=`<div class="chat-setup"><h3>创建自定义角色</h3><p>设置名字、头像和性格，之后可以随时与 TA 私聊。</p><div class="form-grid"><label>名字<input class="field" id="newCharacterName" maxlength="16" placeholder="例如：Luna"></label><div><span style="display:block;margin-bottom:8px">头像</span><div class="avatar-choices" id="newCharacterAvatars">${avatars.map((a,i)=>`<button type="button" class="avatar-choice ${i===0?'selected':''}" data-avatar="${a}">${a}</button>`).join('')}</div></div><label class="wide">性格<textarea class="field" id="newCharacterPersona" maxlength="80" placeholder="例如：温柔、幽默、擅长鼓励人"></textarea></label></div><div class="actions"><button class="ghost" id="cancelChatSetup">取消</button><button class="primary" id="saveCharacter">创建角色</button></div></div>`;
      else room.innerHTML=`<div class="chat-setup"><h3>创建多人群聊</h3><p>选择至少两位角色组成群聊，每次发送消息都会有不同成员回应。</p><div class="form-grid"><label>群聊名称<input class="field" id="newGroupName" maxlength="20" placeholder="例如：周末客厅"></label><div><span style="display:block;margin-bottom:8px">群头像</span><div class="avatar-choices" id="newGroupAvatars">${['🛋️','🌌','☕','🎧','🏕️','🎐'].map((a,i)=>`<button type="button" class="avatar-choice ${i===0?'selected':''}" data-avatar="${a}">${a}</button>`).join('')}</div></div><div class="wide"><span style="display:block;margin-bottom:8px">成员</span><div class="member-choices">${state.characters.map(c=>`<label class="member-choice"><input type="checkbox" value="${c.id}"><span>${c.avatar} ${safe(c.name)}</span></label>`).join('')}</div></div></div><div class="actions"><button class="ghost" id="cancelChatSetup">取消</button><button class="primary" id="saveGroup">创建群聊</button></div></div>`;
      let avatar=mode==='private'?'🌙':'🛋️';$$('.avatar-choice',room).forEach(b=>b.onclick=()=>{avatar=b.dataset.avatar;$$('.avatar-choice',room).forEach(x=>x.classList.toggle('selected',x===b));});$('#cancelChatSetup').onclick=renderChatRoom;
      if(mode==='private')$('#saveCharacter').onclick=()=>{const name=$('#newCharacterName').value.trim(),persona=$('#newCharacterPersona').value.trim();if(!name||!persona){toast('请填写名字和性格');return;}const id=`char-${Date.now()}`;state.characters.push({id,name,avatar,persona});persist('characters');chatUI.activeId=id;renderChatHub();toast('新角色已创建');};
      else $('#saveGroup').onclick=()=>{const name=$('#newGroupName').value.trim(),members=$$('.member-choice input:checked').map(x=>x.value);if(!name){toast('请填写群聊名称');return;}if(members.length<2){toast('请选择至少两位成员');return;}const id=`group-${Date.now()}`;state.groups.push({id,name,avatar,members});persist('groups');chatUI.activeId=id;renderChatHub();toast('新群聊已创建');};
    }
    function hash(s){ return [...s].reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0); }
    const oracleAnswers=['先把答案放下，去看你一直忽略的感受。','允许事情暂时没有结论。','你已经知道方向，只是还在等待勇气。','从最小、最诚实的一步开始。','不是所有失去都需要追回。','给它一点时间，也给自己一点空间。','去问那个让你变得安静的答案。','今天适合观察，不急着决定。'];
    function oracleAnswer(question){ return oracleAnswers[Math.abs(hash(question+new Date().toDateString()))%oracleAnswers.length]; }
    function moonPhase(){ const known=new Date('2000-01-06T18:14:00Z').getTime(); const cycle=29.53058867; const age=((Date.now()-known)/86400000%cycle+cycle)%cycle; let name='渐盈凸月',copy='能量正在积累，适合把想法慢慢推向现实。'; if(age<1.8){name='新月';copy='适合清空、播种，以及从很小的愿望开始。'} else if(age<7.4){name='蛾眉月';copy='有些事情正在发芽，不必催促。'} else if(age<9.2){name='上弦月';copy='到了把犹豫变成行动的时候。'} else if(age<16.6){name='盈凸月';copy='继续靠近你真正在意的事。'} else if(age<18.4){name='满月';copy='适合看清、庆祝，也适合温柔地放下。'} else if(age<23.9){name='亏凸月';copy='把获得的东西分享出去，余光会回来。'} else if(age<25.8){name='下弦月';copy='删去不必要的负担，给生活一点留白。'} else {name='残月';copy='休息不是停下，而是在为下一轮积蓄。'} return {name,age:age.toFixed(1),copy}; }
    function todayFortune(){ const options=[['✦','温柔推进','不需要用力证明什么。今天最顺利的路线，是把注意力放回手边的小事。'],['◐','留一点白','一个未完成的答案也可以是好答案。先观察，再决定。'],['≈','顺流而行','今天适合回应已经发生的事，不必额外制造紧迫感。'],['○','轻装出发','放下一件其实不属于你的负担，脚步会立刻变轻。']]; const seed=Math.abs(hash(new Date().toDateString())); const o=options[seed%options.length]; return {mark:o[0],title:o[1],copy:o[2],score:68+seed%27}; }
    function startBreath(){ const text=$('#breathText'),btn=$('#startBreath'); if(btn.disabled)return; btn.disabled=true; let left=60; const tick=()=>{ const phase=left%14; text.textContent=phase>=10?'缓缓呼气……':phase>=6?'停留片刻……':'慢慢吸气……'; btn.textContent=`还剩 ${left} 秒`; if(left--<=0){clearInterval(timer);text.textContent='完成了。把这份安静带回接下来的一小时。';btn.textContent='再来一次';btn.disabled=false;} }; tick(); const timer=setInterval(tick,1000); }

    $$('[data-open]').forEach(b=>b.onclick=()=>openModal(b.dataset.open));
    $$('.nav-button').forEach(b=>b.onclick=()=>{ $$('.nav-button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); $$('.view').forEach(v=>v.classList.toggle('active',v.id===b.dataset.view)); if(b.dataset.view==='memoriesView')renderMemories(); if(b.dataset.view==='momentsView')renderMoments(); window.scrollTo({top:0,behavior:'smooth'}); });
    $$('.swatch').forEach(b=>b.onclick=()=>setAccent(b.dataset.accent));
    if(!localStorage.getItem('liminal.accepted')) $('#notice').classList.add('open');
    $('#acceptNotice').onclick=()=>{ localStorage.setItem('liminal.accepted','1'); $('#notice').classList.remove('open'); };
    renderMemories(); renderMoments();
    if(state.moods[0]){ $('#moodTitle').textContent=`此刻状态：${state.moods[0].mood}`; $('#moodHint').textContent=moodCopy[state.moods[0].mood]; }

    function registerWebMCP(){
      const context=document.modelContext; if(!context?.registerTool)return;
      const controller=new AbortController();
      const register=tool=>Promise.resolve(context.registerTool(tool,{signal:controller.signal})).catch(()=>{});
      register({name:'save_memory',title:'保存一份记忆',description:'把一段文字保存到 LIMINAL 的本地记忆盒，并立即更新页面。',inputSchema:{type:'object',properties:{text:{type:'string',minLength:1,maxLength:360}},required:['text'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute(input){if(!input||typeof input.text!=='string'||!input.text.trim()||input.text.length>360)throw new Error('text 必须是 1–360 个字符');saveMemory(input.text.trim());return {saved:true,count:state.memories.length};}});
      register({name:'get_today_reflection',title:'读取今日提示',description:'读取今天的月相和轻量反思提示，不修改任何数据。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){const moon=moonPhase(),fortune=todayFortune();return {moon_phase:moon.name,moon_age_days:moon.age,reflection:fortune.copy};}});
      register({name:'record_mood',title:'记录此刻心情',description:'记录一种预设心情，并更新主页与最近片刻。',inputSchema:{type:'object',properties:{mood:{type:'string',enum:['平静','轻盈','疲惫','混乱','期待']}},required:['mood'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!moodCopy[input.mood])throw new Error('mood 必须是预设选项');state.moods.unshift({mood:input.mood,time:Date.now()});persist('moods');$('#moodTitle').textContent=`此刻状态：${input.mood}`;$('#moodHint').textContent=moodCopy[input.mood];renderMoments();return {saved:true,mood:input.mood};}});
      register({name:'list_chat_targets',title:'读取聊天对象',description:'读取可用的私聊角色和群聊，不修改聊天数据。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(){return {private_chats:state.characters.map(x=>({id:x.id,name:x.name,avatar:x.avatar})),group_chats:state.groups.map(x=>({id:x.id,name:x.name,avatar:x.avatar,members:x.members}))};}});
      register({name:'send_chat_message',title:'发送聊天消息',description:'向指定角色或群聊发送消息，并把消息及回复保存到页面会话。',inputSchema:{type:'object',properties:{mode:{type:'string',enum:['private','group']},target_id:{type:'string',minLength:1},text:{type:'string',minLength:1,maxLength:240}},required:['mode','target_id','text'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute(input){if(!input||!['private','group'].includes(input.mode)||typeof input.target_id!=='string'||typeof input.text!=='string'||!input.text.trim()||input.text.length>240)throw new Error('聊天参数无效');return sendChatMessage(input.text.trim(),input.mode,input.target_id);}});
      register({name:'update_chat_profile',title:'更新聊天主页',description:'更新用户在主页与聊天中显示的昵称和 emoji 头像。',inputSchema:{type:'object',properties:{name:{type:'string',minLength:1,maxLength:16},avatar:{type:'string',enum:['🌙','⭐','🫧','🐈','🪐','🌿','🦋','☁️']}},required:['name','avatar'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:true},execute(input){if(!input||typeof input.name!=='string'||!input.name.trim()||input.name.length>16||!['🌙','⭐','🫧','🐈','🪐','🌿','🦋','☁️'].includes(input.avatar))throw new Error('主页参数无效');state.profile={name:input.name.trim(),avatar:input.avatar};persist('profile');renderProfile();return {updated:true,profile:state.profile};}});
    }
    registerWebMCP();
  </script>
