  /* ⚠ 锚点纪律：这两项必须用活代码独有的形式，不能用会出现在新注释里的字面文案，
     否则命中注释误判失败（v60 / v66 已各栽一次）。 */
  ['单体历史停止写入',          'writeDreamJSON(CHAT_HISTORY_STORAGE_KEY, state);', 'v70：这份冗余副本实测独占约一半 localStorage'],
  ['旧误导提示已移除',          "showChatToast('消息已显示，但本地缓存写入失败", 'v70：数据没丢也没法从存储中心恢复，文案是错的'],
  ['无条件裁挂件的规则已移除',  'html[data-perf-mode="lite"] .chat-message-line{content-visibility:auto', 'v71：这条会把顶部挂件从 26px 切到 4px'],
  ['只判气泡框的旧豁免已修正',  'html[data-perf-mode="lite"] #chatApp:not([data-chat-bubble="custom"]) .chat-message-line{content-visibility', 'v72：漏了主题 CSS 框，从那边贴的挂件仍被切'],
  /* ⚠ 反向锚点必须查 class 引用/代码原形，不能用中文文案（纪律，已踩 7 次） */
  ['无差别提速的假守卫已移除',  '*:not([style*="infinite"]){ animation-duration', 'v94：全文 0 个行内 infinite，守卫恒假'],
  /* ⚠ 锚点不能只写 .chat-typing-dot —— v94 的说明注释里提到了这个名字，
     会被自己的注释命中而误判。必须用「活规则」独有的形式（带 ] 前缀和 , / { 结尾）。 */
  ['臆造的动画类名已移除',      '] .chat-voice-record-bar{',             'v94：该类名全文 DOM 引用为 0，规则从未生效'],
];

function analyse(txt){
  const build=(txt.match(/MOBIUS_BUILD\s*=\s*'([^']*)'/)||[])[1]||'(读不到)';
  const pass=[],fail=[];
  [...CHECKS,...CHECKS60].forEach(([name,needle,desc])=>{
    (txt.includes(needle)?pass:fail).push([name,desc,needle]);
  });
  NEG.forEach(([name,needle,desc])=>{
    (txt.includes(needle)?fail:pass).push([name,desc,needle]);
  });
  return {build,pass,fail,size:txt.length};
}
function render(r){
  const box=document.getElementById('res');
  const total=CHECKS.length+CHECKS60.length+NEG.length;
  const good=r.fail.length===0;
  const isV53=/v109/.test(r.build);
  let html='';
  html+=`<div class="verdict ${good?'good':'bad'}">
    <b>${good?'✅ 这份是 v109，功能齐全':'⚠ 这份不是最新版，缺少下列功能'}</b>
    通过 ${r.pass.length} / ${total} 项　·　构建号 <code>${esc(r.build)}</code>　·　${(r.size/1048576).toFixed(2)} MB
  </div>`;
  html+='<div class="card"><h3>逐项结果</h3>';
  r.pass.forEach(([n,d])=>{html+=`<div class="row ok"><span class="ic">✓</span><span class="tx"><b>${esc(n)}</b><small>${esc(d)}</small></span></div>`;});
  r.fail.forEach(([n,d,k])=>{html+=`<div class="row no"><span class="ic">✕</span><span class="tx"><b>${esc(n)}</b><small>${esc(d)}<br>缺少标记：${esc(k)}</small></span></div>`;});
  html+='</div>';
  if(!good||!isV53){
    html+=`<div class="fix"><h3>怎么更新到 v108</h3><ol>
      <li>确认下载到的包是 <code>约 1.84 MB</code>（1,934,xxx 字节上下）。文件偏小说明下载被截断了，重下。</li>
      <li>把包里的 <b>index.html 和 sw.js 一起</b>替换掉，只换 index.html 不管用 —— sw.js 里的 <code>CACHE_VERSION</code> 要变成 v108 才会刷新缓存。</li>
      <li>手机上把已安装的 Möbius <b>彻底关掉</b>（不是切到后台，是从多任务里划掉）。</li>
      <li>重新打开，等两三秒让 Service Worker 换版。若仍是旧的，在浏览器里清掉该站点数据再进。</li>
      <li>再回来点一次上面的检测。</li>
    </ol></div>`;
  }else{
    html+=`<div class="fix"><h3>功能齐全，那怎么用</h3><ol>
      <li>先在<b>全局设置</b>里把接口地址、Key、模型填好并保存 —— 没配好不会出现人设页，这是特意设计的。</li>
      <li>进<b>查手机</b>，选一位<b>之前没设定过</b>的梦角。</li>
      <li>会先弹人设页（身份 / 性格 / 习惯 / 往事），填完点保存，接着才是钱夹那三步。</li>
      <li>已经设定过的梦角不会再弹。想重填的话，进星图后点底部的「<b>人设</b>」按钮。</li>
      <li>填完在星图底部点「使用 AI 生成」，只会刷新<b>浏览记录 / 备忘录 / 最近常听</b>三项。</li>
    </ol></div>`;
  }
  box.innerHTML=html;
  box.classList.add('on');
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fail(msg){
  const box=document.getElementById('res');
  box.innerHTML=`<div class="verdict bad"><b>读取失败</b>${esc(msg)}<div class="mini">直接用浏览器打开你的 index.html，全选复制，用上面的「手动粘贴」再试一次。</div></div>`;
  box.classList.add('on');
}
/* ⚠ v94 补：三个按钮里唯独「手动粘贴」调用的 runText 从来没有被定义过，
   点了必然抛 ReferenceError。而它恰恰是手机用户唯一能走通的路径
   （file:// 下 runFetch 会被 CORS 挡掉）。 */
function runText(txt){
  const t=String(txt||'').trim();
  if(!t)return fail('粘贴框是空的。请先把 index.html 的内容整份复制进去。');
  if(!t.includes('MOBIUS_BUILD'))return fail('这段内容里找不到 MOBIUS_BUILD，可能没复制完整，或复制的不是 index.html。');
  render(analyse(t));
}
async function runFetch(url){
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(analyse(await r.text()));
  }catch(e){fail('无法读取 '+url+'：'+e.message);}
}
async function runLive(){
  try{
    if(!('caches' in window))throw new Error('这个浏览器不支持读取缓存');
    const names=await caches.keys();
    if(!names.length)throw new Error('没有找到任何缓存，可能还没安装成 PWA');
    for(const n of names){
      const c=await caches.open(n);
      const keys=await c.keys();
      for(const k of keys){
        if(/index\.html|\/$/.test(k.url)){
          const resp=await c.match(k);
          if(resp){
            const t=await resp.text();
            if(t.includes('MOBIUS_BUILD')){
              const r=analyse(t);
              r.build+=`（来自缓存 ${n}）`;
              return render(r);
            }
          }
        }
      }
    }
    throw new Error('缓存里没找到 index.html。缓存名：'+names.join(', '));
  }catch(e){fail(e.message);}
}
</script>
